<body>
    <header>
        <div class="logo">Academy System</div>
        <nav>
            <ul>
                <li data-section="dashboard" class="active" data-i18n="dashboard">Dashboard</li>
                <li data-section="students" data-i18n="students">Students</li>
                <li data-section="teachers" data-i18n="teachers">Teachers</li>
                <li data-section="attendance" data-i18n="attendance">Attendance</li>
                <li data-section="finance" data-i18n="finance">Finance</li>
                <li data-section="settings" data-i18n="settings">Settings</li>
            </ul>
        </nav>
        <div class="language-switch">
            <button id="lang-toggle" data-i18n="language_btn">English</button>
        </div>
    </header>

    <main id="app-content">
        <!-- Dynamic Content will be loaded here -->
        <section id="dashboard" class="active-section">
            <h1 data-i18n="welcome">Welcome to the Academy Management System</h1>
            <div id="dashboard-container" style="margin-top:20px;"></div>
        </section>
        <section id="students" class="hidden">
            <h1 data-i18n="students">Students</h1>
            <div id="students-container"></div>
        </section>
        <section id="teachers" class="hidden">
            <h1 data-i18n="teachers">Teachers</h1>
            <div id="teachers-container"></div>
        </section>
        <section id="attendance" class="hidden">
            <h1 data-i18n="attendance">Attendance</h1>
            <div id="attendance-container"></div>
        </section>
        <section id="finance" class="hidden">
            <h1 data-i18n="finance">Finance</h1>
            <div id="finance-container"></div>
        </section>
        <section id="settings" class="hidden">
            <h1 data-i18n="settings">Settings</h1>
            <div id="settings-container"></div>
        </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/ui.js"></script> <!-- UI Utilities -->
    <script src="js/state.js"></script>
    <script src="js/modules/settings.js"></script>
    <script src="js/modules/teachers.js"></script>
    <script src="js/modules/students.js"></script>
    <script src="js/modules/attendance.js"></script>
    <script src="js/modules/finance.js"></script>
    <script src="js/modules/dashboard.js"></script> <!-- Dashboard Module -->
    <script src="js/app.js"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker Registered'))
            .catch(err => console.log('SW Registration Failed:', err));
        });
      }
    </script>
</body>

</html>
